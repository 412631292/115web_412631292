<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <!-- 設定文字編碼，避免中文顯示亂碼 -->
  <meta charset="UTF-8">

  <!-- 讓網頁能適應手機與不同螢幕尺寸 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 瀏覽器分頁標題 -->
  <title>我的個人網站</title>

  <!-- 連結外部 CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 頁首 -->
  <header>
    <h1>我的個人網站</h1>

    <!-- 導覽列 -->
    <nav>
      <a href="index.html">首頁</a>

      <a href="about.html">關於我</a>

      <a
        href="https://www.tku.edu.tw/"
        target="_blank"
        rel="noreferrer"
      >
        淡江大學
      </a>
    </nav>
  </header>

  <!-- 主要內容 -->
  <main>

    <!-- 自我介紹 -->
    <section>
      <h2>自我介紹</h2>

      <img
        src="profile.jpg"
        alt="我的個人照片"
      >

      <p>
        大家好，我是淡江大學資訊管理學系的學生，
        目前正在學習網路程式設計。
      </p>

      <p>
        我喜歡學習
        <strong>網頁設計</strong>
        與
        <em>程式開發</em>。
      </p>
    </section>

    <!-- 我的興趣 -->
    <section>
      <h2>我的興趣</h2>

      <ul>
        <li>聽音樂</li>
        <li>打籃球</li>
        <li>程式設計</li>
      </ul>
    </section>

    <!-- 學習步驟 -->
    <section>
      <h2>學習網頁的步驟</h2>

      <ol>
        <li>學習 HTML</li>
        <li>學習 CSS</li>
        <li>學習 JavaScript</li>
      </ol>
    </section>

    <!-- 課程進度 -->
    <section>
      <h2>課程進度</h2>

      <table>
        <caption>網路程式設計課程</caption>

        <thead>
          <tr>
            <th scope="col">週次</th>
            <th scope="col">課程主題</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>Week 1</td>
            <td>GitHub 與開發環境</td>
          </tr>

          <tr>
            <td>Week 2</td>
            <td>Git 基礎</td>
          </tr>

          <tr>
            <td>Week 3</td>
            <td>HTML 網頁基礎</td>
          </tr>

          <tr>
            <td>Week 4</td>
            <td>CSS 與網頁版面設計</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- 更多資訊 -->
    <section>
      <h2>更多資訊</h2>

      <p>
        <a href="about.html">
          查看完整自我介紹
        </a>
      </p>
    </section>

  <!-- 頁尾 -->
  <footer>
    <p>© 2026 我的個人網站</p>
