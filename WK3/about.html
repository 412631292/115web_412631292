<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>關於我 - About Me</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      max-width: 600px;
      width: 100%;
      border-radius: 12px;
      padding: 35px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 40px;
      font-weight: bold;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #111827;
    }

    .subtitle {
      color: #6b7280;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .bio {
      font-size: 0.95rem;
      color: #4b5563;
      text-align: left;
      margin-bottom: 25px;
      border-left: 4px solid #4f46e5;
      padding-left: 15px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .tag {
      background-color: #e0e7ff;
      color: #3730a3;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .btn {
      display: inline-block;
      padding: 10px 24px;
      background-color: #4f46e5;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">A</div>
    <h1>你好，歡迎來到關於頁面</h1>
    <p class="subtitle">網路程式設計 / 網頁前端開發</p>

    <div class="bio">
      <p>這是一個簡單的 <code>about.html</code> 示範頁面。你可以在這裡介紹你自己的背景、專案經歷、或者網站的核心理念。</p>
    </div>

    <div class="skills">
      <span class="tag">HTML5</span>
      <span class="tag">CSS3</span>
      <span class="tag">JavaScript</span>
      <span class="tag">Web Development</span>
    </div>

    <button class="btn" onclick="sayHello()">點擊打個招呼</button>
  </div>

  <script>
    function sayHello() {
      alert("哈囉！歡迎來到我的網站！");
    }
  </script>
</body>
</html>
